<VirtualHost *:443>
    ServerName adr.stephens.page
    DocumentRoot /var/www/adr.stephens.page/current
    <Directory /var/www/adr.stephens.page>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.html
    ErrorDocument 404 /404.html
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/adr.stephens.page/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/adr.stephens.page/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    # Keep assets from older releases available to readers with an open tab.
    Alias /_astro/ /var/www/adr.stephens.page/assets/
    <Location /_astro/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
    <FilesMatch "\.(html|json|xml)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/adr_error.log
    CustomLog ${APACHE_LOG_DIR}/adr_access.log combined
</VirtualHost>
