name: Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check and test the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    name: Deploy to adr.stephens.page
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install the restricted key and pinned host identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy"
          ssh-keygen -y -f "$HOME/.ssh/deploy" > /dev/null
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          stephens.page ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILhE7HuN3JlkaSZZUPcTnZ1yG+5mOS/6XH9YfWwIpTJe
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy the checked commit
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            jacob@stephens.page "deploy $TARGET_SHA"
